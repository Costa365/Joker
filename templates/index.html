<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <title>Joker</title>
  <link rel="stylesheet" href="/static/index.css"/>
</head>
<body>
  <div class="main">
  <div class="header">
    <img class="header-logo" src="/static/banner.png" alt="Joker">
  </div>
  <div class="content">
    <div><p id="joke"><img src="/static/spinner.gif"></p></div>
  </div>
  <div class="votes">
    <div><p id="votes"></p></div>
  </div>
  <div class="get-another">
    <button
      id="nextJokeButton"
      hx-get="/joke"
      hx-target="#joke"
      hx-trigger="click, load"
      hx-disabled-elt="#nextJokeButton"
      hx-swap="innerHTML">
      Get Another Joke
    </button>
  </div>
  <details class="leaderboard" id="leaderboard">
    <summary>
      <span class="leaderboard-icon" aria-hidden="true">♛</span>
      <span class="leaderboard-title">Top Rated Jokes</span>
      <span class="leaderboard-toggle" aria-hidden="true">+</span>
    </summary>
    <section class="leaderboard-body" aria-label="Top rated jokes">
      <header class="leaderboard-heading">
        <p>The top 10, ranked by average rating.<br><span>More votes break a tie. Every laugh counts.</span></p>
        <button class="leaderboard-refresh" id="refreshTopJokes" hx-get="/top-jokes" hx-target="#topJokes" hx-trigger="click, leaderboard-open from:body" hx-disabled-elt="this" hx-indicator="#leaderboardLoading">Refresh <span aria-hidden="true">↻</span></button>
      </header>
      <p class="leaderboard-loading htmx-indicator" id="leaderboardLoading" role="status">Finding the crowd favourites…</p>
      <div id="topJokes" aria-live="polite"></div>
    </section>
  </details>
  <div class="footer">
    <a href="https://github.com/Costa365/Joker" target="_blank"><img class="footer-logo" src="/static/github-logo.png" alt="GitHub"></a>
    <a href="https://htmx.org/" target="_blank"><img class="footer-logo" src="/static/htmx-logo.png" alt="Htmx"></a>
    <a href="https://go.dev/" target="_blank"> <img class="footer-logo" src="/static/go-logo.png" alt="Go"></a>
    <a href="https://turso.tech/" target="_blank"><img class="footer-logo" src="/static/turso-logo.png" alt="Turso"></a>
    <a href="https://www.docker.com/" target="_blank"><img class="footer-logo" src="/static/docker-logo.png" alt="Docker"></a>
  </div>
  </div>

  <script>
    document.getElementById('leaderboard').addEventListener('toggle', function() {
      if (this.open && !this.dataset.loaded) {
        this.dataset.loaded = 'true';
        htmx.trigger(document.body, 'leaderboard-open');
      }
    });
    document.body.addEventListener('htmx:responseError', function(event) {
      if (event.detail.target.id === 'topJokes') {
        document.getElementById('topJokes').textContent = 'Could not load the leaderboard. Please try Refresh.';
      }
    });
    document.body.addEventListener('htmx:sendError', function(event) {
      if (event.detail.target.id === 'topJokes') {
        document.getElementById('topJokes').textContent = 'Could not connect. Please try Refresh.';
      }
    });
    document.getElementById('nextJokeButton').addEventListener('click', function() {
      var jokeElement = document.getElementById('joke');
      var votesElement = document.getElementById('votes');
      jokeElement.innerHTML = '<img src="/static/spinner.gif">';
      votesElement.innerHTML = '';
    });
  </script>

</body>
</html>
